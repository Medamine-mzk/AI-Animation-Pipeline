      /* Was width:760px -- a fixed overlay that covered ~40% of the stage it

  <script>
    // Defined before the module script so it is available to loadDiarization()
    // as well as to the playback loop. Kept tiny and defensive: a diagnostic
    // that throws would take the player down with it.
    window.showConsistencyWarning = function (message) {
      try {
        var el = document.getElementById('consistency-warning');
        if (!el) return;
        if (!message) { el.hidden = true; return; }
        el.innerHTML = '<strong>Dialogue / audio mismatch</strong><br>' + message;
        el.hidden = false;
      } catch (e) { /* a banner is never worth breaking playback over */ }
    };
  </script>
  <div id="icon-overlay"><div class="pill"><img id="icon-img" src="" alt="" style="display:none"><span id="mood-emoji"></span></div></div>
  <script type="module">
    import * as THREE from 'three';
    import { TalkingHead } from 'talkinghead';
    import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DragControls } from 'three/addons/controls/DragControls.js';
    const BG_LIST = ["assets/background/horsleygate_hall-4k_fitted.glb"];
    const isSmooth = new URLSearchParams(location.search).get('smooth')==='1';
    const state = { mainHead: null, avatars: {}, audioBuffer: null, diarization: null, icons: [], iconDict: {}, isPlaying: false, scheduledTimeouts: [], recorder: null, recordChunks: [], isRecording: false, recordAudioDest: null, recordedBlob: null, downloadUrl: null,
      // Fixed now that their pickers are gone: lip-sync is always the hybrid
      // auto path, and animation is always Full FBX (every job's segments carry a
      // clip, verified across all of them).
      lipsyncMode: 'auto', cameraMode: 'hybrid', animMode: 'fbx', mixers: {}, walkMixers: {}, clipCache: new Map(), bgGroup: null, lastBox: null, bgCurrent: null, camTween: null, isSmooth };
    function easeInOutCubic(x){ return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2; }
    // Smooth spring (when ?smooth=1) - single writer, live head tracking, no stacked tweens
    const camSpring = { look: new THREE.Vector3(0, 1.6, 0), init: false };
    function moveCameraTo(targetPos, targetLookAt, duration=550, opts={}){
      if(!state.mainHead) return;
      if(state.isSmooth){
        const cam=state.mainHead.camera;
        if(!opts.force && state.camGoal && cam.position.distanceTo(targetPos)<0.03 && camSpring.look.distanceTo(targetLookAt)<0.03) return;
        if(!state.camGoal) state.camGoal={ pos:new THREE.Vector3(), look:new THREE.Vector3() };
        state.camGoal.pos.copy(targetPos); state.camGoal.look.copy(targetLookAt);
        if(!camSpring.init){ camSpring.look.copy(targetLookAt); camSpring.init=true; }
        if(duration>0 && !state.isPlaying) state._camGlideUntil = performance.now() + 1200;
        if(duration===0 || opts.force){
          const ctrl=state.mainHead.controls;
          cam.position.copy(targetPos); camSpring.look.copy(targetLookAt);
          cam.lookAt(targetLookAt);
          if(ctrl){ ctrl.target.copy(targetLookAt); if(!state.isPlaying) ctrl.update(); }
        }
        return;
      }
      const cam=state.mainHead.camera, ctrl=state.mainHead.controls;
      const curTarget=ctrl ? ctrl.target.clone() : targetLookAt.clone();
      if(!opts.force && cam.position.distanceTo(targetPos)<0.03 && curTarget.distanceTo(targetLookAt)<0.03) return;
      state.camTween={fromPos:cam.position.clone(), toPos:targetPos.clone(), fromTarget:curTarget, toTarget:targetLookAt.clone(), start:performance.now(), dur:duration};
      if(ctrl) ctrl.enabled=false;
    }
    function tickCameraTween(dtMs){
      if(state.isSmooth){
        if(!state.mainHead || !state.camGoal) return;
        if(!state.isPlaying && !(state._camGlideUntil && performance.now() < state._camGlideUntil)) return;
        const cam=state.mainHead.camera, ctrl=state.mainHead.controls;
        const dt=Math.min(0.1, Math.max(0.001, (dtMs||16.7)/1000));
        let goalLook=state.camGoal.look;
        if(state.isPlaying && state._activeSpeaker && state.avatars[state._activeSpeaker]){
          const av=state.avatars[state._activeSpeaker];
          if(av.armature && av.armature.visible){
            goalLook=getHeadWorldPos(av); goalLook.y+=0.04;
          }
        }
        const k=1-Math.exp(-5.5*dt);
        cam.position.lerp(state.camGoal.pos, k);
        camSpring.look.lerp(goalLook, k);
        cam.lookAt(camSpring.look);
        if(ctrl) ctrl.target.copy(camSpring.look);
        return;
      }
      const tw=state.camTween;
      if(!tw || !state.mainHead) return;
      const cam=state.mainHead.camera, ctrl=state.mainHead.controls;
      const u=Math.min(1, (performance.now()-tw.start)/tw.dur);
      const e=easeInOutCubic(u);
      cam.position.lerpVectors(tw.fromPos, tw.toPos, e);
      const look=new THREE.Vector3().lerpVectors(tw.fromTarget, tw.toTarget, e);
      cam.lookAt(look);
      if(ctrl) ctrl.target.copy(look);
      if(u>=1){ state.camTween=null; if(ctrl){ ctrl.enabled=true; ctrl.update(); } }
    }
    const container = document.getElementById('scene-container');
    const statusEl = document.getElementById('status');
    const playBtn = document.getElementById('playBtn');
    const stopBtn = document.getElementById('stopBtn');
    const recordBtn = document.getElementById('recordBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const recordStatus = document.getElementById('recordStatus');
    const subtitleBox = document.getElementById('subtitle-box');
    const speakerLabel = document.getElementById('speaker-label');
    const loading = document.getElementById('loading');
    function sanitizeClipForAvatar(clip, avatar, keepHips=false) {
      if(!clip || !avatar || !avatar.armature) return clip;
      const boneSet = new Set();
      avatar.armature.traverse(o=>{ if(o.isBone) boneSet.add(o.name); });
      // Also add lowercased for case-insensitive fallback
      const boneSetLower = new Set([...boneSet].map(n=> n.toLowerCase()));
      const cloned = clip.clone();
      const newTracks = [];
      let dropped = 0, remapped = 0;
      for(const track of cloned.tracks) {
        const dotIdx = track.name.indexOf('.');
        const bonePart = dotIdx>=0 ? track.name.slice(0, dotIdx) : track.name;
        const prop = dotIdx>=0 ? track.name.slice(dotIdx) : '';
        // Strip mixamorig prefix (handles mixamorig, mixamorig:, mixamorig5:, mixamorigHips)
        let stripped = bonePart.split(':').pop();
        stripped = stripped.replace(/^mixamorig\d*:?/i, '').replace(/^mixamorig_/i,'').replace(/^mixamorig/i,'');
        stripped = stripped.replace(/^:/,'');
        if(!stripped) continue;
        // Find real bone name (case-sensitive first, then lower)
        let real = null;
        if(boneSet.has(stripped)) real = stripped;
        else {
          const lower = stripped.toLowerCase();
          for(const b of boneSet) { if(b.toLowerCase()===lower) { real = b; break; } }
        }
        if(!real) { dropped++; continue; }
        // Strip Hips position to avoid sliding — keep for walk clips
        if(real==='Hips' && prop.includes('.position') && !keepHips) { dropped++; continue; }
        track.name = real + prop;
        newTracks.push(track);
        if(bonePart !== real) remapped++;
      }
      cloned.tracks = newTracks;
      if(remapped || dropped) console.log(`[fbx] ${clip.name} remapped ${remapped} dropped ${dropped} keepHips=${keepHips} for ${avatar.armature.name}`);
      return cloned;
    }
     async function loadClip(url, avatar, keepHips=false) {
      let raw = state.clipCache.get(url);
      if(!raw) {
        try {
          const loader = new FBXLoader();
          const obj = await loader.loadAsync(encodeURI(url));
          raw = obj.animations[0];
          if(!raw) return null;
          state.clipCache.set(url, raw);
        } catch(e) { console.warn('clip load failed', url, e.message); return null; }
      }
      // Clone and retarget per avatar so multiple skeletons can share cache
      let clip = raw.clone();
      if(avatar) {
        try {
          clip = sanitizeClipForAvatar(clip, avatar, keepHips || /Standard Walk/i.test(url));
        } catch(e) { console.warn('sanitize failed', e.message); }
      } else {
        clip.tracks.forEach(t=> t.name = t.name.replace(/^mixamorig\d*:?/i,''));
        if(!keepHips) clip.tracks = clip.tracks.filter(t=> !(t.name==='Hips.position'));
      }
      return clip;
    }
    async function initScene() {
      // Icons helpers (dark pill + word+mood)
      const iconOverlay = document.getElementById('icon-overlay');
      const iconImg = document.getElementById('icon-img');
      const moodEmoji = document.getElementById('mood-emoji');
      function activeIcon(t){ if(!state.icons.length) return null; let best=null; for(const ev of state.icons){ if(t>=ev.start && t<=ev.end){ if(!best || (ev.end-ev.start)>(best.end-best.start)) best=ev; } } return best; }
      function iconEnvelope(t, ev){ const POP=1.0, FADE=1.2; const HOLD=0.8; const endHold=ev.end+HOLD; if(t<ev.start||t>endHold) return {alpha:0,scale:0.3}; const d=endHold-ev.start; if(t-ev.start<POP){ const x=(t-ev.start)/POP; const s=1-Math.pow(1-x,3); return {alpha:x,scale:0.3+0.7*s}; } if(endHold-t<FADE){ const x=(endHold-t)/FADE; return {alpha:x,scale:0.9+0.1*x}; } return {alpha:1,scale:1}; }
      function updateIcons(t){
        const ev=activeIcon(t);
        const seg=state.diarization?.segments?.find(s=> t>=s.start && t< s.end);
        const moodRaw=seg?.go_label || seg?.mood || 'neutral';
        const moodIcon = state.iconDict[moodRaw] || state.iconDict[moodRaw.toLowerCase()] || '';
        moodEmoji.textContent = moodIcon ? moodIcon : (ev ? '' : '');
        if(ev){
          const word=ev.word.toLowerCase();
          const hasPix = state.pixabayIndex && state.pixabayIndex[word] && !state.pixabayIndex[word].fallback && state.pixabayIndex[word]!==null;
          // only load image if word has a real icon - Iconify SVG vs local PNG vs emoji
          let iconForWord = null;
          let isIconify = false;
          if (state.icons) {
            const found = state.icons.find(ic => ic.word && ic.word.toLowerCase()===word);
            if (found) { iconForWord = found.icon; isIconify = !!found.isIconify || (found.icon && found.icon.includes(':')); }
          }
          if (!iconForWord && state.iconDict && state.iconDict[word]) iconForWord = state.iconDict[word];
          // check if Iconify (contains :)
          if (iconForWord && iconForWord.includes(':')) isIconify = true;
          const isEmoji = iconForWord && !isIconify && iconForWord.length <= 4;
          const isDefaultIcon = !iconForWord || iconForWord === "💬";
          if (isDefaultIcon) {
            // no icon or default - hide image, emoji fallback will show via moodEmoji if needed
            iconImg.style.display='none';
            iconImg.dataset.src='';
            // show default emoji via moodEmoji if no activeIcon
            if (!isIconify && iconForWord === "💬") {
              moodEmoji.textContent = "💬";
              iconOverlay.classList.add('active');
              moodEmoji.style.opacity = '1';
            }
          } else if (isIconify) {
            // Iconify SVG - fetch via api.iconify.design
            let src = `https://api.iconify.design/${iconForWord}.svg?height=72`;
            if(iconImg.dataset.src!==src){
              iconImg.dataset.src=src;
              iconImg.src=src;
              iconImg.onerror=()=>{ iconImg.style.display='none'; iconImg.onerror=null; };
            }
            iconImg.style.display='';
            iconImg.style.objectFit='contain';
          } else if (isEmoji) {
            // local emoji - show via moodEmoji, hide image
            iconImg.style.display='none';
            moodEmoji.textContent = iconForWord;
            iconOverlay.classList.add('active');
            moodEmoji.style.opacity='1';
            iconImg.dataset.src='';
          } else {
            let src= hasPix ? `app/assets/pixabay/${word}.jpg` : `app/assets/icons/${word}.png`;
            if(iconImg.dataset.src!==src){
              iconImg.dataset.src=src;
              iconImg.src=src;
              iconImg.onerror=()=>{ iconImg.style.display='none'; iconImg.onerror=null; };
            }
            iconImg.style.display='';
          }
          iconImg.style.objectFit='cover'; iconImg.style.borderRadius='8px';
          const env=iconEnvelope(t,ev);
          iconOverlay.classList.add('active');
          iconImg.style.opacity=env.alpha;
          iconImg.style.transform=`scale(${env.scale})`;
          iconOverlay.style.opacity=env.alpha;
          moodEmoji.style.opacity=env.alpha;
        } else if(moodIcon){
          iconImg.style.display='none';
          iconOverlay.classList.add('active');
          iconOverlay.style.opacity=1;
          moodEmoji.style.opacity=1;
        } else {
          iconOverlay.classList.remove('active');
        }
      }
      state.mainHead = new TalkingHead(container, {
        cameraView: 'full', cameraDistance: 1.2, cameraY: 0.4, cameraRotateEnable: true, cameraZoomEnable: true, cameraPanEnable: true,
        lightAmbientIntensity: 6, lightDirectIntensity: 80, lightDirectPhi: 0.1, lightDirectTheta: 1.2, lightSpotIntensity: 20, avatarMood: 'neutral',
        update: (dt) => {
          Object.values(state.avatars).forEach(av => { try{ av.animate(dt); }catch(e){} });
          // Listeners track whoever is speaking. updateGaze() is throttled
          // internally; updateGazeBodies() must run every frame so the camera
          // helpers cannot undo the body turn between ticks. Both are no-ops
          // before playback and for single-speaker jobs.
          // Date.now(), not dt: dt is a ~16ms delta and the throttle compares
          // against a wall clock, so passing dt made every frame look throttled.
          try { updateGaze(Date.now()); } catch(e){}

     *
     *  Works in the parent's frame: a nested armature's local rotation.y does
     *  not equal its world yaw, and the camera helpers write local rotation too. */
    function turnBodyToward(avatar, target) {
      if (!avatar || !avatar.armature) return false;
      try {
        const head = getHeadWorldPos(avatar);
        const from = (target && typeof target.x === 'number') ? target

        if (!from || !head) return false;

        // Yaw of the parent, so local and world rotations can be compared.
        let parentYaw = 0;
        try {
          const parent = avatar.armature.parent;

            const pd = new THREE.Vector3();

        const yawCur = wrap(worldCur - parentYaw);
        const diff = wrap(yawWant - yawCur);

    function dialoguePartner(focusId, segStart) {

    function faceEachOther(idA, idB) {

      function placeDialogueCam(focusId, segStart, dur) {

      const partnerId = dialoguePartner(focusId, t);
      const isPartnerPresent = partnerId && state.avatars[partnerId] && isPresent(partnerId, t);
      let members = [focus];

      const center = new THREE.Vector3(0,0,0);
      heads.forEach(h=> center.add(h));
      center.divideScalar(heads.length);
      // Generous: use max span in XZ, margin 1.4
      let span = 0;
      for(let i=0;i<heads.length;i++) for(let j=i+1;j<heads.length;j++) span = Math.max(span, Math.hypot(heads[i].x-heads[j].x, heads[i].z-heads[j].z));
      span = Math.max(span, 0.6);

      const hHalf = Math.atan(Math.tan(halfFov)* (state.mainHead.camera.aspect||1.77));
      let dist = ((span/2)+0.20)/Math.tan(hHalf);

                         candidates.filter(o=> o.morphTargetDictionary['viseme_aa']!==undefined).sort((a,b)=>Object.keys(b.morphTargetDictionary).length - Object.keys(a.morphTargetDictionary).length)[0] ||
                         candidates.filter(o=> o.morphTargetDictionary.jawOpen!==undefined).sort((a,b)=>Object.keys(b.morphTargetDictionary).length - Object.keys(a.morphTargetDictionary).length)[0] ||
                         candidates.filter(o=> o.morphTargetDictionary['aa']!==undefined).sort((a,b)=>Object.keys(b.morphTargetDictionary).length - Object.keys(a.morphTargetDictionary).length)[0] ||
                         best;
              if(!headMesh && avatar.morphTargetDictionary) headMesh = avatar;
            }
            const mode = state.lipsyncMode || 'auto';
            if(!headMesh || !headMesh.morphTargetDictionary) {
              // Placeholder has no morphs — skip
            } else {
              const dict = headMesh.morphTargetDictionary;
              const visCount = Object.keys(dict).filter(k=> k.startsWith('viseme_')).length;
              const bareVisCount = Object.keys(dict).filter(k=> ['aa','PP','DD','FF','CH','E','I','ih','O','oh','U','ou','kk','nn','RR','sil'].includes(k)).length;
              if(seg.start < 2) console.log(`[lips] ${seg.speaker} headMesh ${headMesh.name} morphs ${Object.keys(dict).length} visemes ${visCount} (bare ${bareVisCount}) mode ${mode} words ${wordData.words.length}`);
              // Hybrid: viseme primary (TalkingHead smoothed), jaw fallback if viseme stays 0
              const hasFullVisemes = visCount >= 10;
              let useJawFallback = mode === 'jaw' || (mode === 'auto' && !hasFullVisemes);
              // Watchdog: if viseme expected but not moving after 600ms, fallback to jaw - natural speed
              let jawFallbackTimer = null;
              if(!useJawFallback && hasFullVisemes) {
                const visIdxProbe = dict['viseme_aa'] ?? dict['aa'] ?? dict['jawOpen'];
                let peak = 0;
                const iv = setInterval(()=>{
                  try { const v = visIdxProbe!==undefined ? headMesh.morphTargetInfluences[visIdxProbe] : 0; peak = Math.max(peak, v); } catch(e){}
                }, 30);
                jawFallbackTimer = setTimeout(()=>{
                  clearInterval(iv);
                  if(peak < 0.08) {
                    console.warn(`[lips] ${seg.speaker} viseme still 0 (peak ${peak.toFixed(2)}), falling back to jaw (natural 2Hz)`);
                    const jawIdxFb = dict['jawOpen']??dict['mouthOpen']??dict['aa'];
                    if(jawIdxFb===undefined) return;
                    // natural 2Hz: every other word, moderate open, longer hold
                    wordData.wtimes.forEach((t, i)=>{
                      if(i%2!==0) return; // every other word = 2Hz, not every word 3Hz
                      const w = wordData.words[i];
                      const dur = Math.max(wordData.wdurations[i] || 400, 350);
                      let open = 0.45;
                      if(/^[aeiou]/i.test(w)) open = 0.60;
                      if(/^[o]/i.test(w)) open = 0.52;
                      if(/^[bp]/i.test(w)) open = 0.30;
                      setTimeout(()=>{
                        if(!state.isPlaying) return;
                        headMesh.morphTargetInfluences[jawIdxFb]=open;
                        setTimeout(()=>{ try{ headMesh.morphTargetInfluences[jawIdxFb]=open*0.4; }catch(e){} }, dur*0.5);
                        setTimeout(()=>{ try{ headMesh.morphTargetInfluences[jawIdxFb]=0; }catch(e){} }, dur*0.90);
                      }, t);
                    });
                  } else {
                    console.log(`[lips] ${seg.speaker} viseme peak ${peak.toFixed(2)} — native viseme working`);
                  }
                }, 500);
              }
              const jawIdx = dict['jawOpen'] ?? dict['mouthOpen'] ?? dict['aa'];
              if(useJawFallback && jawIdx !== undefined) {
                // Natural jaw: every other word 2Hz moderate
                wordData.wtimes.forEach((t,i)=>{
                  if(i%2!==0) return;
                  const w=wordData.words[i];
                  const dur=Math.max(wordData.wdurations[i]||380, 300);
                  let open=0.45;
                  if(/^[aeiou]/i.test(w)) open=0.58;
                  if(/^[o]/i.test(w)) open=0.50;
                  if(/^[bp]/i.test(w)) open=0.30;
                  setTimeout(()=>{
                    if(!state.isPlaying) return;
                    headMesh.morphTargetInfluences[jawIdx]=open;
                    setTimeout(()=>{ try{ headMesh.morphTargetInfluences[jawIdx]=open*0.4; }catch(e){} }, dur*0.5);
                    setTimeout(()=>{ try{ headMesh.morphTargetInfluences[jawIdx]=0; }catch(e){} }, dur*0.90);
                  }, t);
                });
                if(seg.start < 2) console.log(`[lips] ${seg.speaker} using JAW natural 2Hz (visemes: ${visCount}) segDur ${segmentDuration}`);
                if(seg.start < 2) console.log(`[lips] ${seg.speaker} using JAW FALLBACK slow (visemes: ${visCount}) segDur ${segDur} words ${wordData.words.length}`);
              } else if(seg.start < 2 && hasFullVisemes) {
                console.log(`[lips] ${seg.speaker} trusting native viseme animation only (visemes: ${visCount})`);
              }
              // Clear watchdog if segment ends early
              setTimeout(()=>{ try{ clearInterval(jawFallbackTimer); }catch(e){} }, segmentDuration + 200);
            }
          } catch(e) { console.warn('mouth check failed', e); }
          avatar.speakAudio({ audio: segmentAudio, ...wordData }, { lipsyncLang: seg.lipsyncLang || state.diarization.speakers?.[seg.speaker]?.lipsyncLang || 'en' }, () => {});
          setTimeout(() => { subtitleBox.classList.remove('active'); speakerLabel.classList.remove('active'); }, segmentDuration + 200);
        }, seg.start * 1000);
        state.scheduledTimeouts.push(timeoutId);
      });
      // End when the AUDIO ends, not when the last line does. Taking this from
      // the segments alone meant a dialogue belonging to a longer recording kept
      // the player running for a minute of silence after the audio was over --
      // four jobs did exactly that, each with a dialogue 61s longer than its own
      // audio. Out-of-bounds lines were already skipped; this stops the dead air.
      const audioEndMs = (state.audioBuffer && state.audioBuffer.duration ? state.audioBuffer.duration : Infinity) * 1000;
      // The +1s tail is the "hold the last frame a beat, then stop" grace period.
      // It must NEVER take part in the mismatch test: folding it in made the
      // check fire on every healthy job whose last line lands within a second of
      // the audio, and then printed both numbers identical ("runs to 100.7s but
      // the audio is only 100.7s"). Lines end exactly at the audio all the time.
      const lastLineEndMs = segments[segments.length - 1].end * 1000;
      const totalDuration = Math.min(lastLineEndMs + 1000, audioEndMs);
      // Same 5s tolerance the server uses (DIALOGUE_OVERRUN_TOLERANCE_S) so the
      // banner and the API can never disagree about the same job.
      if (lastLineEndMs > audioEndMs + 5000) {
        console.warn(`[dialogue] lines run to ${(lastLineEndMs/1000).toFixed(1)}s but the audio is only ${(audioEndMs/1000).toFixed(1)}s -- this dialogue may belong to another recording`);
        showConsistencyWarning(`This dialogue runs to ${(lastLineEndMs/1000).toFixed(1)}s but the audio is only ${(audioEndMs/1000).toFixed(1)}s. The lines after that point were written for a different recording.`);
      }
      const endTimeout = setTimeout(() => { state.isPlaying = false; playBtn.disabled = false; stopBtn.disabled = true; statusEl.textContent = 'Dialogue finished.'; }, totalDuration);
      state.scheduledTimeouts.push(endTimeout);
    }
    function stopDialogue() {
      state.isPlaying = false; state.scheduledTimeouts.forEach(clearTimeout); state.scheduledTimeouts = [];
      Object.values(state.avatars).forEach(av => { try { av.stop(); av.start(); } catch(e) {} });
      subtitleBox.classList.remove('active'); speakerLabel.classList.remove('active');
      playBtn.disabled = false; stopBtn.disabled = true; recordBtn.disabled = !(state.audioBuffer && state.diarization);
      if (state.isRecording) stopRecording();
      statusEl.textContent = 'Stopped.';
    }
    function startRecording() {
      if (!state.mainHead || !state.mainHead.renderer) { recordStatus.textContent='Renderer not ready'; return; }
      const canvas = document.querySelector('#scene-container canvas') || state.mainHead.renderer.domElement;
      if(!canvas || canvas.width===0 || canvas.height===0) { recordStatus.textContent='Canvas not ready (0x0) — try again after scene loads'; return; }
      const videoStream = canvas.captureStream(24);
      let combined = videoStream;
      try {
        if(state.recordAudioDest) {
          const aTracks = state.recordAudioDest.stream.getAudioTracks();
          // If no audio tracks yet, the stream will get them when first speakAudio connects
          combined = new MediaStream([...videoStream.getVideoTracks(), ...aTracks]);
          // If still no audio tracks, keep video only and audio will be added on first speak (MediaRecorder will pick up new tracks? need to recreate, so just warn)
          if(aTracks.length===0) console.warn('recordAudioDest has 0 tracks yet — audio will be added on first speak');
        }
      } catch(e) { console.warn('combine streams failed', e); combined = videoStream; }
      if(combined.getVideoTracks().length===0) { recordStatus.textContent='captureStream no video tracks'; return; }
      state.recordChunks = [];
      const mimes = ['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'];
      let mime = mimes.find(m=>MediaRecorder.isTypeSupported(m));
      if(!mime) { recordStatus.textContent='MediaRecorder mime unsupported'; return; }
      try {
        state.recorder = new MediaRecorder(combined, {mimeType: mime, videoBitsPerSecond: 8000000});
      } catch(e) {
        try { state.recorder = new MediaRecorder(combined); mime = state.recorder.mimeType; } catch(e2){ recordStatus.textContent='MediaRecorder failed '+e2.message; return; }
      }
      state.recorder.ondataavailable = e => { if(e.data && e.data.size>0) state.recordChunks.push(e.data); };
      state.recorder.onstop = () => {
        try { clearInterval(state._recordInterval); } catch(e){}
        const blob = new Blob(state.recordChunks, {type: mime});
        state.recordedBlob = blob;
        if(state.downloadUrl) { try{ URL.revokeObjectURL(state.downloadUrl); }catch(e){} }
        state.downloadUrl = URL.createObjectURL(blob);
        const hasVideo = combined.getVideoTracks().length>0, hasAudio = combined.getAudioTracks().length>0;
        recordStatus.textContent = `Ready to download: ${ (blob.size/1e6).toFixed(1)}MB ${mime.split('/')[1]} (${state.recordChunks.length} chunks) video:${hasVideo} audio:${hasAudio} — click Download Video`;
        downloadBtn.disabled = false;
        state.isRecording=false; recordBtn.textContent='● Record Video (fast)'; recordBtn.style.background='#dc2626';
        statusEl.textContent='Recording finished — click Download Video to save';
      };
      // Keep renderer ticking while recording (placeholders have no animate)
      state._recordInterval = setInterval(()=>{ try{ state.mainHead.renderer.render(state.mainHead.scene, state.mainHead.camera); }catch(e){} }, 1000/24);
      try { state.recorder.start(100); } catch(e){ recordStatus.textContent='start failed '+e.message; clearInterval(state._recordInterval); return; }
      state.isRecording=true; recordBtn.textContent='■ Stop Recording'; recordBtn.style.background='#991b1b';
      recordStatus.textContent='Recording at 24fps (video+audio)...';
      statusEl.textContent='Recording + playing...';
    }
    function stopRecording() {
      if(state.recorder && state.isRecording){
        try { state.recorder.requestData(); } catch(e){}
        state.recorder.stop(); state.isRecording=false;
        try { clearInterval(state._recordInterval); } catch(e){}
      }
    }
    // The Audio/Diarization pickers, the Lip-sync select and the Anim select are
    // gone: both inputs always came from the job on the server, and lip-sync is
    // always 'auto' and animation always Full FBX.
    document.getElementById('cameraMode').addEventListener('change', (e)=>{ state.cameraMode = e.target.value; console.log('cameraMode', state.cameraMode); if(state.cameraMode==='wide') frameAvatars(); });
    // smooth toggle (?smooth=1)
    const smoothToggle=document.getElementById('smoothToggle');
    if(smoothToggle){
      smoothToggle.checked = !!state.isSmooth;
      smoothToggle.addEventListener('change', (e)=>{
        const on=e.target.checked;
        const url=new URL(location.href);
        if(on) url.searchParams.set('smooth','1'); else url.searchParams.delete('smooth');
        // keep job param
        location.href=url.toString();
      });
    }
    playBtn.addEventListener('click', playDialogue);
    stopBtn.addEventListener('click', stopDialogue);
    recordBtn.addEventListener('click', async () => {
      if(state.isRecording){ stopRecording(); return; }
      if(!state.audioBuffer || !state.diarization){ recordStatus.textContent='Load audio + JSON first'; return; }
      // Clear previous download
      if(state.downloadUrl){ try{ URL.revokeObjectURL(state.downloadUrl); }catch(e){} state.downloadUrl=null; state.recordedBlob=null; downloadBtn.disabled=true; }
      startRecording();
      await playDialogue();
      // FIX: account for the intro sequence (item 4) so recording doesn't get cut off
      // before the actual dialogue segments finish playing.
      const total = computeIntroDelayMs() + state.diarization.segments[state.diarization.segments.length-1].end*1000+1500;
      setTimeout(()=>{ if(state.isRecording) stopRecording(); }, total);
    });
    downloadBtn.addEventListener('click', () => {
      if(!state.recordedBlob || !state.downloadUrl){ recordStatus.textContent='No recording yet — click Record first'; return; }
      const a = document.createElement('a'); a.href=state.downloadUrl; a.download='dialogue_'+Date.now()+'.webm'; a.click();
      recordStatus.textContent='Download started';
    });
    // Transparent hide/show pkz
    const uiPanel=document.getElementById('ui-panel'), hideBtn=document.getElementById('hidePanelBtn'), toggleBtn=document.getElementById('togglePanelBtn');
    function setPanelVisible(v){ uiPanel.classList.toggle('hidden', !v); toggleBtn.classList.toggle('show', !v); }
    hideBtn.addEventListener('click', ()=> setPanelVisible(false));
    toggleBtn.addEventListener('click', ()=> setPanelVisible(true));
    document.addEventListener('keydown', (e)=>{ if(e.key.toLowerCase()==='k' && (e.ctrlKey||e.metaKey) && e.shiftKey){ e.preventDefault(); setPanelVisible(uiPanel.classList.contains('hidden')); } else if(e.key.toLowerCase()==='z' && e.ctrlKey && !e.shiftKey && !e.metaKey){ /* pkz alias */ } });
    // pkz shortcut: press P+K+Z together or just 'k' with pkz hint - use 'p' then 'k' then 'z' sequence
    let pkzBuf=''; document.addEventListener('keydown', (e)=>{ pkzBuf=(pkzBuf+e.key.toLowerCase()).slice(-3); if(pkzBuf==='pkz'){ setPanelVisible(uiPanel.classList.contains('hidden')); pkzBuf=''; } });
    // autocapture via ?record=1
    if(new URLSearchParams(location.search).has('record')){
      const check = setInterval(()=>{ if(state.audioBuffer && state.diarization && !state.isRecording){ clearInterval(check); recordBtn.click(); } }, 500);
    }
    initScene().catch(err => { console.error('Init failed:', err); statusEl.textContent = 'Error: ' + err.message; loading.classList.add('hidden'); });
  </script>
</body>
</html>
